<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#1e1e2e"/>
  
  <!-- Tablet/Device shape -->
  <rect x="4" y="3" width="24" height="26" rx="3" stroke="#cba6f7" stroke-width="1.5" fill="none"/>
  
  <!-- Screen area -->
  <rect x="6" y="5" width="20" height="18" rx="1" fill="#89b4fa" fill-opacity="0.2"/>
  
  <!-- Screen content: Phase indicator bar -->
  <rect x="8" y="7" width="16" height="2" rx="1" fill="#f38ba8"/>
  
  <!-- Screen content: VP counters -->
  <rect x="8" y="11" width="6" height="3" rx="0.5" fill="#a6e3a1"/>
  <rect x="18" y="11" width="6" height="3" rx="0.5" fill="#89b4fa"/>
  
  <!-- Screen content: Action buttons -->
  <rect x="8" y="16" width="4" height="4" rx="0.5" fill="#f9e2af"/>
  <rect x="14" y="16" width="4" height="4" rx="0.5" fill="#f9e2af"/>
  <rect x="20" y="16" width="4" height="4" rx="0.5" fill="#f9e2af"/>
  
  <!-- Home indicator -->
  <rect x="12" y="26" width="8" height="2" rx="1" fill="#cba6f7"/>
</svg>
